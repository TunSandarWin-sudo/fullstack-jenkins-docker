version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: fs_project-db-1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: fs_db
      MYSQL_USER: fs_user
      MYSQL_PASSWORD: fs_pass
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d 
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin","ping","-h","localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fs_project-backend-1
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=db
      - DB_USER=fs_user
      - DB_PASS=fs_pass
      - DB_NAME=fs_db
    # ✅ 修复: 使用 condition: service_healthy
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: fs_project-frontend-1
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://192.168.56.1:4000
    depends_on:
      # ⚠️ 提示：为了简化，可以仅依赖 backend
      # 或者继续使用 condition: service_healthy
      backend:
        condition: service_started 
    # 或者为了确保后端完全就绪才启动前端：
    # backend:
    #   condition: service_healthy
        
volumes:
  db_data: